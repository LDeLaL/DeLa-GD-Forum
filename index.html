<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeLa GD Forum</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <span>DeLa</span> GD Forum
        </div>

        <nav>
            <a href="#" class="active">LIST</a>
            <a href="#">RECORDS</a>
            <a href="#">ABOUT</a>
        </nav>
    </header>


    <main>

        <section class="hero">
            <h1>DEMONLIST</h1>
            <p>DeLa GD Forum Demon Ranking</p>
        </section>


        <section class="controls">

            <input
                type="text"
                id="search"
                placeholder="Search levels..."
            >

            <select id="difficulty">
                <option value="all">All Difficulties</option>
                <option value="Extreme Demon">Extreme Demon</option>
                <option value="Insane Demon">Insane Demon</option>
                <option value="Hard Demon">Hard Demon</option>
            </select>

        </section>


        <section class="ranking">

            <div class="table-header">
                <div>#</div>
                <div>LEVEL</div>
                <div>DIFFICULTY</div>
            </div>

            <div id="level-list"></div>

        </section>

    </main>


    <footer>
        <p>DeLa GD Forum © 2026</p>
        <p>Unofficial Geometry Dash Ranking</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
