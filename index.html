<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeLa GD Forum</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <span>DeLa</span> GD Forum
        </div>

        <nav>
            <a href="#" class="active">LIST</a>
            <a href="#">RECORDS</a>
            <a href="#">ABOUT</a>
        </nav>
    </header>


    <main>

        <!-- RANKING PAGE -->

        <section id="ranking-page">

            <section class="hero">
                <h1>DEMONLIST</h1>
                <p>DeLa GD Forum Demon Ranking</p>
            </section>


            <section class="controls">

                <input
                    type="text"
                    id="search"
                    placeholder="Search levels..."
                >

                <select id="difficulty">
                    <option value="all">All Difficulties</option>
                    <option value="Extreme Demon">Extreme Demon</option>
                    <option value="Insane Demon">Insane Demon</option>
                    <option value="Hard Demon">Hard Demon</option>
                </select>

            </section>


            <section class="ranking">

                <div class="table-header">
                    <div>#</div>
                    <div>LEVEL</div>
                    <div>DIFFICULTY</div>
                </div>

                <div id="level-list"></div>

            </section>

        </section>


        <!-- LEVEL DETAIL PAGE -->

        <section id="detail-page" class="hidden">

            <button id="back-button">
                ← Back to Demonlist
            </button>

            <div class="detail-header">

                <div>
                    <div id="detail-rank" class="detail-rank"></div>

                    <h1 id="detail-name"></h1>

                    <div id="detail-difficulty"
                         class="detail-difficulty">
                    </div>
                </div>

            </div>


            <!-- REGISTRATION INFORMATION -->

            <section class="detail-section">

                <h2>Registration Information</h2>

                <div class="info-grid">

                    <div class="info-box">
                        <span>등재일</span>
                        <strong id="detail-date"></strong>
                    </div>

                    <div class="info-box">
                        <span>등재번호</span>
                        <strong id="detail-number"></strong>
                    </div>

                    <div class="info-box">
                        <span>등재 당시 포럼 1위</span>
                        <strong id="detail-first"></strong>
                    </div>

                </div>

            </section>


            <!-- DIFFICULTY INFORMATION -->

            <section class="detail-section">

                <h2>Level Information</h2>

                <div class="info-grid">

                    <div class="info-box">
                        <span>절대적 난이도</span>
                        <strong id="detail-absolute"></strong>
                    </div>

                    <div class="info-box">
                        <span>맵 길이</span>
                        <strong id="detail-length"></strong>
                    </div>

                    <div class="info-box">
                        <span>오브젝트 수</span>
                        <strong id="detail-objects"></strong>
                    </div>

                    <div class="info-box">
                        <span>예상 프레임 퍼펙트</span>
                        <strong id="detail-frame"></strong>
                    </div>

                    <div class="info-box">
                        <span>디자인 척도</span>
                        <strong id="detail-design"></strong>
                    </div>

                    <div class="info-box">
                        <span>사용된 노래</span>
                        <strong id="detail-song"></strong>
                    </div>

                </div>

            </section>


            <!-- RANK HISTORY -->

            <section class="detail-section rank-history">

                <h2>Rank History</h2>

                <div id="rank-history"></div>

            </section>

        </section>

    </main>


    <footer>
        <p>DeLa GD Forum © 2026</p>
        <p>Unofficial Geometry Dash Ranking</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
